<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace Core</title>
<!-- dashboard v0.2 : live auto-refresh + activity feed -->
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17202a;--mut:#68727d;--line:#e8ebee;--acc:#0b6efd;--ok:#1a9e54;--warn:#e8a13d}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;max-width:960px;margin:0 auto;padding:12px;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
header h2{margin:0;font-size:20px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.card{background:var(--card);border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0001}
input,select,textarea,button{font-size:14px;padding:8px 10px;margin:4px 4px 4px 0;border-radius:8px;border:1px solid #ccd2d8}
input,textarea,select{background:#fff}
button{background:#111;color:#fff;border:none;cursor:pointer}
button.ghost{background:#eef0f2;color:#111}
button.sm{padding:5px 10px;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs button.on{background:var(--acc)}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.badge{padding:2px 10px;border-radius:12px;font-size:12px;background:#eef0f2;white-space:nowrap}
.badge.done{background:#d7f0e0;color:#14663a}.badge.in_progress{background:#fdeecb;color:#8a5a00}.badge.assigned{background:#dde9fd;color:#0b4fc0}
.key{background:#fff8e1;border:1px dashed #c89600;padding:10px;border-radius:8px;word-break:break-all;font-size:13px;margin:8px 0}
.bar{height:8px;background:#eef0f2;border-radius:6px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar>i.hot{background:#d33}
.sub{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.sub small{color:var(--mut)}
.feed-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed-item .ic{font-size:16px}
.feed-item time{color:var(--mut);font-size:12px;white-space:nowrap;margin-left:auto}
.rowhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rowhead .sp{flex:1}
.chatbox{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;padding:6px 2px}
.bub{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.45;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:#eef0f2;color:var(--ink);border-bottom-left-radius:4px}
.bub .who{font-size:11px;opacity:.7;margin-bottom:2px}
.bub.pending{opacity:.65;font-style:italic}
.chatbar{display:flex;gap:6px;margin-top:8px}
.chatbar input{flex:1}
h3{margin:10px 0 6px;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.prog{font-size:12px;color:var(--mut)}
@media(max-width:600px){td,th{padding:6px 4px;font-size:13px}}
</style>
</head>
<body>
<header>
  <h2>🛰️ Workspace</h2>
  <span class="live"><span class="dot"></span><span id="liveTxt">live</span></span>
  <span style="flex:1"></span>
  <span id="me" class="mut"></span>
  <button class="ghost sm hidden" id="logoutBtn" onclick="logout()">Logout</button>
</header>

<div id="login" class="card">
  <h3>Login / Register</h3>
  <input id="l_name" placeholder="Name (register only)" autocomplete="name"><br>
  <input id="l_email" placeholder="Email" autocomplete="email"><br>
  <input id="l_pass" type="password" placeholder="Password" autocomplete="current-password"><br>
  <button onclick="doAuth('login')">Login</button>
  <button class="ghost" onclick="doAuth('register')">Register</button>
  <p id="l_err" style="color:#c00"></p>
  <p class="mut">First registered user becomes the workspace owner.</p>
</div>

<div id="app" class="hidden">
  <div class="card">
    <div class="tabs">
      <button id="tabBtn_tasks" class="on" onclick="tab('tasks')">📋 Tasks</button>
      <button id="tabBtn_chat" onclick="tab('chat')">💬 Chat</button>
      <button id="tabBtn_activity" onclick="tab('activity')">⚡ Activity</button>
      <button id="tabBtn_agents" onclick="tab('agents')">🤖 Agents</button>
      <button id="tabBtn_usage" onclick="tab('usage')">🔋 Tokens</button>
      <span style="flex:1"></span>
      <label class="mut" style="font-size:13px"><input type="checkbox" id="autoRef" checked style="margin:0"> auto-refresh</label>
    </div>
  </div>

  <div id="t_tasks">
    <div class="card">
      <h3>New task</h3>
      <input id="t_title" placeholder="Task title" style="width:100%"><br>
      <textarea id="t_desc" placeholder="Description (shown to the agent)" rows="2" style="width:100%"></textarea><br>
      <textarea id="t_subs" placeholder="Subtasks — one per line" rows="3" style="width:100%"></textarea><br>
      <button onclick="addTask()">Create task</button>
    </div>
    <div id="t_list"></div>
  </div>

  <div id="t_chat" class="hidden">
    <div class="card">
      <h3>Chat with agent</h3>
      <select id="c_agent" onchange="loadChat(true)"><option value="">select agent…</option></select>
      <div id="c_msgs" class="chatbox"><p class="mut">Pick an agent to start chatting.</p></div>
      <div class="chatbar">
        <input id="c_input" placeholder="Message the agent…" onkeydown="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>

  <div id="t_activity" class="hidden">
    <div class="card"><h3>Live activity</h3><div id="feed"><p class="mut">Waiting for agent activity…</p></div></div>
  </div>

  <div id="t_agents" class="hidden">
    <div class="card">
      <h3>Add agent</h3>
      <input id="a_name" placeholder="Agent name (e.g. researcher-1)">
      <input id="a_caps" placeholder="Capabilities, comma separated">
      <input id="a_limit" type="number" placeholder="Monthly token limit (optional)">
      <button onclick="addAgent()">Create + issue key</button>
      <div id="a_newkey"></div>
    </div>
    <div class="card"><h3>Agents</h3>
      <table><thead><tr><th>Agent</th><th>Workload</th><th>Key</th><th>Limit</th><th></th></tr></thead>
      <tbody id="a_list"></tbody></table>
    </div>
  </div>

  <div id="t_usage" class="hidden">
    <div class="card"><h3>Token usage — this month</h3>
      <table><thead><tr><th>Agent</th><th>Calls</th><th>Total tokens</th><th>vs limit</th></tr></thead>
      <tbody id="u_list"></tbody></table>
    </div>
  </div>
</div>

<script>
let TOK = localStorage.getItem("wc_tok") || "";
let AGENTS = [], TASKS = [], USAGE = [];
let lastSeen = 0;
const H = () => ({"Content-Type":"application/json","Authorization":"Bearer "+TOK});
async function api(m,p,b){ try{ const r=await fetch(p,{method:m,headers:H(),body:b?JSON.stringify(b):undefined}); return await r.json(); }catch(e){ return {ok:false,error:"network"}; } }
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ago(ts){ const s=(Date.now()-new Date(ts).getTime())/1000; if(s<60) return Math.floor(s)+"s ago"; if(s<3600) return Math.floor(s/60)+"m ago"; if(s<86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; }

async function doAuth(kind){
  const body={email:l_email.value,password:l_pass.value};
  if(kind==="register") body.name=l_name.value;
  const r=await api("POST","/api/auth/"+kind,body);
  if(!r.ok){ l_err.textContent=r.error; return; }
  TOK=r.token; localStorage.setItem("wc_tok",TOK); loginUI(r.user);
}
function logout(){ TOK=""; localStorage.removeItem("wc_tok"); location.reload(); }
async function loginUI(user){
  user=user||(await api("GET","/api/me")).user;
  if(!user||!user.id) return;
  login.classList.add("hidden"); app.classList.remove("hidden"); logoutBtn.classList.remove("hidden");
  me.textContent=user.name+" ("+user.role+")";
  startPolling(); refresh(true);
}
function tab(t){
  for(const x of ["tasks","chat","activity","agents","usage"]){
    document.getElementById("t_"+x).classList.toggle("hidden",x!==t);
    document.getElementById("tabBtn_"+x).classList.toggle("on",x===t);
  }
  if(t==="chat") loadChat(true);
}

let CHAT_AGENT=null, CHAT_SIG="";
async function loadChat(force){
  const id=c_agent.value;
  if(!id){ c_msgs.innerHTML=`<p class="mut">Pick an agent to start chatting.</p>`; CHAT_AGENT=null; return; }
  const r=await api("GET","/api/chat/"+id);
  if(!r.ok){ c_msgs.innerHTML=`<p class="mut">${esc(r.error)}</p>`; return; }
  CHAT_AGENT=id;
  const sig=JSON.stringify(r.task.subtasks);
  if(!force&&sig===CHAT_SIG) return;
  CHAT_SIG=sig;
  const aname=(AGENTS.find(a=>a.id===id)||{}).name||"agent";
  c_msgs.innerHTML=r.task.subtasks.map(s=>`
    <div class="bub me"><div class="who">you · ${ago(s.updated_at)}</div>${esc(s.title)}</div>
    ${s.status==="done"&&s.result?`<div class="bub them"><div class="who">${esc(aname)}</div>${esc(s.result)}</div>`
      :`<div class="bub them pending"><div class="who">${esc(aname)} is typing…</div></div>`}
  `).join("")||`<p class="mut">No messages yet — say hi.</p>`;
  c_msgs.scrollTop=c_msgs.scrollHeight;
}
async function sendChat(){
  const id=c_agent.value, msg=c_input.value.trim();
  if(!id||!msg) return;
  c_input.value="";
  const r=await api("POST","/api/chat",{agent_id:id,message:msg});
  if(!r.ok){ alert(r.error); return; }
  loadChat(true);
}
function syncChatAgentOptions(){
  const cur=c_agent.value;
  c_agent.innerHTML=`<option value="">select agent…</option>`+AGENTS.filter(a=>a.status==="active").map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("");
  if(cur&&AGENTS.some(a=>a.id===cur)) c_agent.value=cur;
}

async function addAgent(){
  const r=await api("POST","/api/agents",{name:a_name.value,capabilities:a_caps.value.split(",").map(s=>s.trim()).filter(Boolean),token_limit:a_limit.value?+a_limit.value:null});
  if(!r.ok){ alert(r.error); return; }
  a_newkey.innerHTML=`<p><b>API key — shown once, copy now:</b></p><div class="key">${esc(r.api_key)}</div>`;
  a_name.value=a_caps.value=a_limit.value="";
  refresh(true);
}
async function delAgent(id){ if(confirm("Revoke this agent's key?")){ await api("DELETE","/api/agents/"+id); refresh(true); } }
async function regen(id){ const r=await api("POST",`/api/agents/${id}/regenerate`); if(r.ok) a_newkey.innerHTML=`<p><b>New key — shown once:</b></p><div class="key">${esc(r.api_key)}</div>`; refresh(true); }

async function addTask(){
  const subs=t_subs.value.split("\n").map(s=>s.trim()).filter(Boolean);
  const r=await api("POST","/api/tasks",{title:t_title.value,description:t_desc.value,subtasks:subs});
  if(!r.ok){ alert(r.error); return; }
  t_title.value=t_desc.value=t_subs.value="";
  refresh(true); tab("tasks");
}
async function assign(tid,sid,sel){ if(!sel.value) return; const r=await api("POST",`/api/tasks/${tid}/assign`,{subtask_id:sid,agent_id:sel.value}); if(!r.ok) alert(r.error); refresh(true); }

function agentName(id){ const a=AGENTS.find(x=>x.id===id); return a?a.name:"?"; }
function workload(id){ let n=0; for(const t of TASKS) for(const s of t.subtasks) if(s.agent_id===id&&s.status!=="done") n++; return n; }

function renderAgents(){
  a_list.innerHTML=AGENTS.map(a=>{const w=workload(a.id);return `<tr>
    <td><b>${esc(a.name)}</b><br><span class="mut">${esc((a.capabilities||[]).join(", "))}</span></td>
    <td>${w?`<span class="badge assigned">${w} open</span>`:`<span class="mut">idle</span>`}</td>
    <td class="mut">${esc(a.key_prefix)}</td>
    <td>${a.token_limit??"—"}</td>
    <td style="white-space:nowrap"><button class="ghost sm" onclick="regen('${a.id}')">rekey</button> <button class="ghost sm" onclick="delAgent('${a.id}')">revoke</button></td>
  </tr>`;}).join("")||`<tr><td colspan="5" class="mut">No agents yet — create one above.</td></tr>`;
}

function renderTasks(){
  t_list.innerHTML=TASKS.slice().reverse().map(t=>{
    const done=t.subtasks.filter(s=>s.status==="done").length, n=t.subtasks.length;
    return `<div class="card"><div class="rowhead"><b>${esc(t.title)}</b>
      <span class="badge ${t.status}">${t.status.replace("_"," ")}</span>
      <span class="prog">${done}/${n} done</span><span class="sp"></span>
      <span class="mut" style="font-size:12px">${ago(t.created_at)}</span></div>
      ${t.description?`<div class="mut">${esc(t.description)}</div>`:""}
      ${t.subtasks.map(s=>`<div class="sub">
        <span class="badge ${s.status}">${s.status.replace("_"," ")}</span> ${esc(s.title)}
        ${s.agent_id?`<small> → ${esc(agentName(s.agent_id))}</small>`:""}
        ${s.status==="open"?` <select onchange="assign('${t.id}','${s.id}',this)"><option value="">assign…</option>${AGENTS.filter(a=>a.status==="active").map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select>`:""}
        ${s.result?`<br><small>💬 ${esc(String(s.result).slice(0,300))}</small>`:""}
        <div class="mut" style="font-size:12px">${ago(s.updated_at)}</div>
      </div>`).join("")}
    </div>`;}).join("")||`<div class="card mut">No tasks yet — create one above.</div>`;
}

function renderFeed(){
  const ev=[];
  for(const t of TASKS) for(const s of t.subtasks){
    if(s.status!=="open") ev.push({ts:s.updated_at, html:
      s.status==="done"
        ? `<span class="ic">✅</span><span><b>${esc(agentName(s.agent_id))}</b> completed <b>${esc(s.title)}</b><br><span class="mut">${esc(t.title)}</span></span>`
        : `<span class="ic">📌</span><span><b>${esc(s.title)}</b> assigned to <b>${esc(agentName(s.agent_id))}</b><br><span class="mut">${esc(t.title)}</span></span>`});
  }
  ev.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  feed.innerHTML=ev.slice(0,30).map(e=>`<div class="feed-item">${e.html}<time>${ago(e.ts)}</time></div>`).join("")||`<p class="mut">Waiting for agent activity…</p>`;
}

function renderUsage(){
  u_list.innerHTML=USAGE.map(x=>{
    const pct=x.token_limit?Math.min(100,Math.round(x.total_tokens/x.token_limit*100)):0;
    return `<tr><td><b>${esc(x.agent_name)}</b></td><td>${x.calls}</td>
      <td><b>${x.total_tokens.toLocaleString()}</b> <span class="mut">(${x.prompt_tokens.toLocaleString()}↑ ${x.completion_tokens.toLocaleString()}↓)</span></td>
      <td>${x.token_limit?`<div class="bar"><i class="${pct>85?"hot":""}" style="width:${pct}%"></i></div><span class="mut">${pct}% of ${x.token_limit.toLocaleString()}</span>`:"—"}</td></tr>`;
  }).join("")||`<tr><td colspan="4" class="mut">No usage yet this month.</td></tr>`;
}

let pollTimer=null;
async function refresh(force){
  const [ag,ts,u]=await Promise.all([api("GET","/api/agents"),api("GET","/api/tasks"),api("GET","/api/usage")]);
  let changed=false;
  if(ag.ok){ AGENTS=ag.agents||[]; changed=true; }
  if(ts.ok){
    const sig=JSON.stringify(ts.tasks);
    if(force||sig!==lastSeen){ TASKS=ts.tasks||[]; lastSeen=sig; changed=true; }
  }
  if(u.ok){ USAGE=u.usage||[]; changed=true; }
  if(changed){ renderAgents(); renderTasks(); renderFeed(); renderUsage(); syncChatAgentOptions(); liveTxt.textContent="live · "+new Date().toLocaleTimeString(); }
  if(!document.getElementById("t_chat").classList.contains("hidden")&&CHAT_AGENT) loadChat(false);
}
function startPolling(){
  if(pollTimer) return;
  pollTimer=setInterval(()=>{ if(!document.hidden && document.getElementById("autoRef").checked) refresh(false); },4000);
}
if(TOK) loginUI();
</script>
</body>
</html>
